[package]
name = "sealsuite"
version = "0.1.0"
description = "Manages the SealSuite apps"
authors = ["mkiera"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name apart from the bin name, see https://github.com/rust-lang/cargo/issues/8519
name = "sealsuite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
